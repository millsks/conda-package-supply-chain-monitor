# SonarCloud configuration for conda-package-supply-chain-monitor
#
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project identification
sonar.projectKey=millsks_conda-package-supply-chain-monitor
sonar.organization=millsks

# Project metadata
sonar.projectName=conda-package-supply-chain-monitor
sonar.projectVersion=1.0

# Source code settings
# src/ holds both top-level packages (config, django_service) plus the
# templates and static assets.
sonar.sources=src
sonar.tests=tests

# Python-specific settings
sonar.python.version=3.14

# Coverage settings -- coverage.xml is produced by `pixi run cov`
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,src/config/wsgi.py,src/config/asgi.py,**/migrations/**

# Test settings
sonar.test.inclusions=tests/**

# Exclude files from analysis. The .agents/.claude/_bmad/.bmad-loop trees are
# vendored agent tooling, not project source -- the same set ruff excludes.
sonar.exclusions=**/__pycache__/**,**/*.egg-info/**,.pixi/**,.pytest_cache/**,.mypy_cache/**,.ruff_cache/**,build/**,dist/**,htmlcov/**,site/**,staticfiles/**,.agents/**,.claude/**,_bmad/**,.bmad-loop/**,**/migrations/**

# Code quality settings -- ruff-report.json is produced by `pixi run ruff-report`
sonar.python.ruff.reportPaths=ruff-report.json

# SCM settings
sonar.scm.provider=git
