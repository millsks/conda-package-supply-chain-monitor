# Sprint status for conda-package-supply-chain-monitor.
#
# Generated by hand, not by sprint_plan.py. The script's parser requires positional
# `Epic N` / `Story N.M` headings; this project uses non-positional keys by design, so
# that adding an epic never renumbers another (PRD section 9, epics.md "Epic List"). The keys
# below are the canonical CPM identifiers, lowercased -- they match epics.md and the TEA
# handoff's story bindings exactly.
#
# **Do not run `sprint_plan.py generate` or `fix` against this file.** They do not merely
# fail on the naming above -- they rewrite. `generate` parses epics.md with `^#{1,3}\s*Epic
# \s+(\d+)` and `^#{1,4}\s*Story\s+(\d+)\.(\d+)`, which match none of that file's 81
# headings, so it would resolve zero epics and zero stories and leave `development_status`
# empty. `fix` rebuilds into the positional scheme and would take the CPM keys with it.
# `validate` is safe but always negative: it reports every key here as unrecognized.
# The skill's customize.toml exposes only activation steps, persistent facts and
# on_complete, so none of this is configurable -- the four patterns are hardcoded regexes
# in the script, and editing it there would be overwritten by the next BMad update.
#
# Epic order is the build-order graph in epics.md, not the document's listing order.
# Within CPM-EP-IDENTITY, S01 leads and S06 follows it. S06 and S07 are numbered last
# because story keys are never reused, and epics.md sequences S06 "built before
# CPM-IDENTITY-S02 because every story after it assumes packages exist" -- before S02,
# not before S01. S06 creates package shells through identity's resolution service, so
# it cannot precede S01, which is what defines the Package model those shells are rows
# of. S07 follows S06 immediately and completes the pair -- S06 owns the ingestion
# collector and the snapshot model, S07 the adapter contract and the watchlist files --
# and neither is exercisable alone. The order below is therefore S01, S06, S07, then
# S02 through S05.
#
# An earlier revision of this comment read "S06 leads" and listed S06 and S07 ahead of
# S01. That contradicted epics.md and pointed whoever read the list in order at S02 as
# the successor to S01, which skips the ingestion path every later story assumes.
#
# Status vocabulary: epics backlog|in-progress|done; stories backlog|ready-for-dev|
# in-progress|review|done; retrospectives optional|done.
#
# Every story is ready-for-dev because a story file exists on disk for each one. Later
# epics' files were drafted from the epic breakdown before the epics ahead of them have
# shipped, so expect to refresh them as learnings land -- ready-for-dev means the file
# exists, not that its contents are final.

