# The reviewed policy parameters, keyed by the policy version that applies them.
#
# The contract, the editing rules and what each parameter means are in README.md
# beside this file. Read it before changing a number here: a value in this file
# changes derived verdicts for every package, with no code change and no test
# failure to warn anybody.
#
# Entries are ADDED, never edited in place. A recorded run may be replayed at its
# own version (CPM-FR-22), which is only possible while that version's entry is
# still here.

[versions."2026.09"]
# PROVISIONAL. PRD Open Question 10 asks how long a feedstock may go without a
# push before it is called inactive, and nobody has answered it. 180 days is a
# starting point that review is expected to change, not a decision this component
# has made: half a year is long enough that a stable, finished recipe is not
# reported as abandoned, and short enough that a feedstock nobody has touched
# through two conda-forge migration waves is visible.
#
# Changing it is a pull request against this line. Add a new [versions."..."]
# entry instead if runs recorded at 2026.09 must stay replayable as they were.
feedstock_inactivity_days = 180

[versions."2026.09.1"]
# Added, not edited: 2026.09 above stays exactly as it was so a run recorded at
# it still replays (CPM-FR-22). This entry is 2026.09 plus CPM-FR-17's risk-level
# parameter, which 2026.09 predates and therefore does not record; a run at
# 2026.09 computes currency, feedstock presence and vulnerability alike, and its
# vulnerability rows simply carry no risk level, each saying so in its detail.
# Nothing fails: a version predating a parameter is a historical fact, not a
# misconfiguration, and refusing would have taken that version's currency and
# feedstock rows down with it (one package is the atomic unit, not one pass).
feedstock_inactivity_days = 180

# PROVISIONAL. CPM-FR-17 asks for a per-package risk level and the PRD seeds no
# severity scale for it -- the PRD's own note on CPM-FR-20 says the equivalent
# rules "seed from an organizational risk posture that does not exist yet", and
# no open question has answered this one either.
#
# What this currently is: the four severity labels the common advisory sources
# state, ranked worst first, matched case-insensitively against the `severity`
# string a vulnerability finding stored verbatim. A package's risk level is the
# worst-ranked severity among the advisories matched to it; a matched advisory
# whose severity this list does not name contributes nothing to the ranking, and
# a package whose matched advisories name none of these reads no risk level at
# all, with the row's `detail` saying so.
#
# What review is expected to change: all of it. The labels are the ones sources
# happen to use rather than ones this organization has chosen; the ranking is the
# obvious reading of those four words rather than a posture anybody has stated;
# and a review that decides risk should also weigh how many advisories matched,
# or how the fix is available, would replace this list with whatever expresses
# that. Changing it is a new [versions."..."] entry, not an edit to this one.
#
# What review must NOT do here: add a KEV entry. KEV membership is a stored
# column of its own on every derived row and is never an input to this ordering
# (CPM-FR-17: "never averaged into severity"). A label such as "kev" in this list
# would be exactly the collapse the requirement forbids, and the pass reads this
# order only over a finding's own stated severity.
vulnerability_risk_order = ["critical", "high", "moderate", "low"]

[versions."2026.09.2"]
# Added, not edited: 2026.09 and 2026.09.1 above stay exactly as they were so a
# run recorded at either still replays (CPM-FR-22). This entry is 2026.09.1 plus
# CPM-FR-18's licence rule set, which the two earlier versions predate. Its two
# other parameters are byte-identical to 2026.09.1's, which is deliberate: what
# this entry adds is a *statement* that review looked at the licence policy and
# recorded no rule, where an older version merely could not have carried one.
feedstock_inactivity_days = 180
vulnerability_risk_order = ["critical", "high", "moderate", "low"]

# EMPTY ON PURPOSE, AND NOT PROVISIONAL. CPM-FR-18 gives licence compliance to a
# versioned policy, and *which licences are allowed* is PRD Open Question 2 --
# which the PRD names as unanswered and as blocking CPM-EP-SECURITY.
# CPM-SECURITY-S05's epic entry therefore constrains that story to the mechanism
# and a schema, not a seeded policy, so this list names no licence.
#
# This is deliberately unlike vulnerability_risk_order above, which ships a
# PROVISIONAL value. There the PRD named a risk level and simply seeded no
# thresholds, so a starting point marked as one is a reviewable list. Here the
# PRD names the *decision itself* as open, and a "conservative starting point" or
# a list of permissive licences "everyone agrees on" would be this component
# deciding a compliance question it was told not to decide -- in the one
# direction (allowed) that looks like good news and is least likely to be
# questioned.
#
# What an empty list produces: every package whose licence this run established
# reaches `manual_review`, and every package whose licence it did not establish
# reaches `unknown`. Nothing reaches `allowed`, because `allowed` is reachable
# only from a rule that names a licence and permits it -- in the pass, and again
# in a database check constraint on package_license. That is the correct answer
# to "no licence policy has been decided", and it is exactly what
# CPM-SECURITY-S03's AC 2 already promised.
#
# What review does once Open Question 2 is answered: add a NEW [versions."..."]
# entry -- never edit this one -- carrying one table per rule, like this:
#
#   license_rules = [
#     { expression = "MIT", disposition = "allowed" },
#     { expression = "Apache-2.0", disposition = "allowed" },
#     { expression = "GPL-3.0-only", disposition = "forbidden" },
#     { expression = "MPL-2.0", disposition = "restricted" },
#   ]
#
# `expression` is a normalized SPDX expression exactly as collectors/spdx.py
# produces it and as license_findings.normalized_license stores it, spelled as
# SPDX spells it; the comparison case-folds both sides. An expression that module
# can never produce -- "GPL-3.0", "GPLv3", anything with WITH or parentheses -- is
# REFUSED when this file is read, because such a rule would match no row ever
# written and would forbid nothing, silently and permanently.
#
# `disposition` is one of allowed, restricted, forbidden -- and never
# manual_review, which is what a licence no rule names already reaches.
#
# A compound expression is matched WHOLE. "MIT OR Apache-2.0" offers a choice and
# deciding which licence a package took is a compliance judgement rather than a
# string operation, so a rule that should cover it names it in full and an
# unmatched one reaches manual_review. "MIT AND GPL-3.0-only" is different: a
# conjunction binds both sets of obligations at once, so where no rule names it
# whole, a rule naming one of its operands forbidden or restricted decides it --
# the least permissive winning. That runs one way only: a rule allowing one
# operand never allows the conjunction, because allowed requires a rule naming the
# whole expression.
#
# Naming one expression twice is refused, whether or not the two rules agree.
license_rules = []

[versions."2026.09.3"]
# Added, not edited: the three entries above stay exactly as they were so a run
# recorded at any of them still replays (CPM-FR-22). This entry is 2026.09.2 plus
# CPM-FR-20's priority rule set and score function, which the three earlier
# versions predate. Their three other parameters are byte-identical, which is
# deliberate for the reason 2026.09.2 gives: what this entry adds is a *statement*
# that review looked at the priority policy and recorded nothing, where an older
# version merely could not have carried it.
feedstock_inactivity_days = 180
vulnerability_risk_order = ["critical", "high", "moderate", "low"]
license_rules = []

# EMPTY ON PURPOSE, AND NOT PROVISIONAL. CPM-FR-20 assigns a priority bucket by
# top-down first-match rules, and PRD Open Question 8 -- *what seeds the rule set
# and the score function?* -- answers "both are undefined: they encode an
# organizational risk posture that does not exist yet", and names the question as
# blocking CPM-EP-PRIORITY. CPM-PRIORITY-S01's epic entry then constrains that
# story to "the engine, the schema and the explainability fields -- not a seeded
# rule set". So this list names no rule.
#
# This is the same posture license_rules takes above and for the same reason: the
# PRD names the *decision itself* as open. A "sensible starting point" here would
# be worse than one for licences, because it would not look like a compliance
# claim -- it would look like a priority queue, which is the artifact people act on
# first thing in the morning without asking where the order came from.
#
# What an empty list produces: every package reaches `unknown`, and no package
# carries a bucket, a description, a matched rule or a reason. Nothing reaches
# `p10` -- a default bucket is a claim about a package's importance that nobody
# made, and `p10` is the one that would look harmless. The pass says so on every
# row's `detail`.
#
# What review does once Open Question 8 is answered: add a NEW [versions."..."]
# entry -- never edit this one -- carrying one table per rule, in the order they
# are matched, like this:
#
#   (SHAPE ONLY -- NOT COPY-PASTEABLE. A TOML inline table may not span lines, so
#   the layout below will not parse. `[versions."2026.09.4"]` at the foot of this
#   file writes the same thing as an array of tables, which does.)
#
#   (SHAPE ONLY -- NOT COPY-PASTEABLE. A TOML inline table may not span lines, so
#   the layout below does not parse. The proposed [versions."2026.09.4"] entry at
#   the foot of this file writes the same thing as an array of tables, which does.)
#
#   priority_rules = [
#     { bucket = "p1",
#       description = "Vulnerable, and the fix is already packaged",
#       reason = "An advisory matched and a surface carries the fixed version",
#       when = { vulnerability_status = "advisories_matched", remediation_readiness = "ready" } },
#     { bucket = "p3",
#       description = "Vulnerable, fix not yet available",
#       reason = "An advisory matched and no surface carries the fixed version",
#       when = { vulnerability_status = "advisories_matched" } },
#   ]
#
# `bucket` is one of p1..p10. `description` says what the bucket means and
# `reason` says why this rule fires; both are stored on every row the rule
# produces, which is CPM-PRIORITY-S01's AC 2 -- an assignment explains itself so
# nobody has to open this file to read it. Both are required and both are refused
# blank: a rule that assigns a bucket and says nothing is the row the story exists
# to prevent, and it is the reviewer, not the code, who would have left the
# explanation out.
#
# `when` is a table of derived verdicts that must ALL hold, matched against the six
# policy passes that run before this one: currency_status,
# feedstock_presence_status, vulnerability_status, license_outcome,
# remediation_readiness, python_readiness.
#
# KEV MEMBERSHIP IS NOT ONE OF THEM, and it is worth knowing before writing rules.
# `kev_membership` is a column of `package_vulnerability` and not a domain
# `PRIORITY_DOMAINS` names, so no rule can say "this advisory is known to be
# exploited" -- which is the single strongest priority signal the product holds and
# the reason CPM-FR-11 exists. The example above used to be labelled
# "Known-exploited vulnerability with a published fix" while testing nothing of the
# kind; the label was wrong, not the condition, and it has been corrected. Closing
# the gap means adding a seventh entry to PRIORITY_DOMAINS and a seventh
# DOMAIN_READER, which is a change to the pass and not to this file. It is required and refused empty -- an
# empty condition matches every package, which is a default bucket wearing a
# condition. A domain this list does not name is refused, because a rule matching
# on something no pass answers would match nothing, for ever, silently.
#
# Rules are matched TOP DOWN and the FIRST match wins. Order is the whole of the
# policy: a broad rule placed above a narrow one makes the narrow one unreachable,
# and nothing here will tell you -- write the most specific rules first.
priority_rules = []

# EMPTY ON PURPOSE, on exactly the terms above. CPM-FR-20 also asks for a 1-100
# score computed from internal usage signals, to rank within a bucket, and PRD
# Open Question 8 names the score function as undefined in the same breath as the
# rules.
#
# What an empty table produces: no score at all. Not zero -- a score of zero is a
# number about a package, and what this records is that nobody has decided how to
# score one. A package with no score still gets a bucket if a rule matches it.
#
# What review does once the function is decided: name each signal and the weight
# it carries, like this:
#
#   priority_score_weights = { internal_component_count = 3, internal_lob_count = 2 }
#
# The signals are the ones the inventory observes (CPM-AD-25, PRD Open Question
# 3b): internal_component_count and internal_lob_count, which are required on
# every observed inventory row and are the usage breadth CPM-FR-4 ranks by; and
# apps, platforms, downloads and versions, which are nullable because no
# hand-authored watchlist can state them credibly.
#
# A weight on a NULLABLE signal has a consequence worth knowing before you write
# one: the score is refused for any package whose weighted signal is blank, and
# the row names the signal. Blank means missing and is never invented (PRD
# Appendix A.1), so a score computed as though a missing signal were zero would
# rank a package this product knows nothing about below one it does. Weighting
# only the two required signals is the shape that always produces a score.
priority_score_weights = {}

# ---------------------------------------------------------------------------
# A PROPOSED priority rule set. NOT IN USE.
# ---------------------------------------------------------------------------
#
# PRD Open Question 8 leaves the priority rules and the score function undefined,
# and every version above records them empty rather than guessing. The entry below
# is a guess, offered for review. Nothing runs at it by accident: a policy run
# applies the version it is *asked* for, `run_policy` takes that version as an
# argument, and nothing names this one.
#
# WHO SHOULD DECIDE THIS. Not the implementing agent, which is why this is a
# proposal and not a change. "Exploited beats critical-without-a-fix" is a security
# posture, not a technical fact, and it decides what people work on each morning.
# What follows is a starting point to argue with.
#
# WHAT IT CANNOT SAY: known exploitation. `kev_membership` is not one of the six
# matchable domains -- see the note above `priority_rules` in 2026.09.3 -- so the top
# bucket here is "vulnerable with a fix already packaged" rather than "known to be
# exploited". That is the wrong top bucket. The recommendation is to add a seventh
# domain to the pass before this rule set, or any rule set, is adopted.
#
# THE SHAPE is CPM-PRIORITY-S01's and is not in question: a bucket says *what kind
# of problem this is* and the score ranks within a bucket by *how much this package
# matters to us*. That split is what makes an assignment explainable, which is what
# CPM-FR-20 requires.
[versions."2026.09.4"]
feedstock_inactivity_days = 180
vulnerability_risk_order = ["critical", "high", "moderate", "low"]
license_rules = []

# Two signals rather than six. `internal_component_count` and `internal_lob_count`
# are the internal usage the brief describes; weighting `downloads` or `versions`
# would rank by how popular a package is on the internet rather than by how much
# this organisation depends on it. The other four stay unweighted until somebody
# argues for one.
#
# Lines of business weigh more per unit than components because breadth of exposure
# is what makes an incident an organisational problem rather than a team's: forty
# components in one team is a bad afternoon, four lines of business is a briefing.
# That ratio is the most arguable number here.
priority_score_weights = { internal_lob_count = 5, internal_component_count = 1 }

# ORDER IS THE POLICY. Matched top down, first match wins, so each rule below is
# narrower than the one under it. Written as an array of tables because a TOML
# inline table MAY NOT SPAN LINES -- the worked example in 2026.09.3's comment is
# unparseable as written for exactly that reason, and is now marked as shape-only.

# Act today: the work is packaging a fix that already exists.
[[versions."2026.09.4".priority_rules]]
bucket = "p1"
description = "Vulnerable, and the fix is already packaged"
reason = "An advisory matched this version and a surface already carries the fixed version"
when = { vulnerability_status = "advisories_matched", remediation_readiness = "ready" }

# Act today, but somebody has to build it first.
[[versions."2026.09.4".priority_rules]]
bucket = "p2"
description = "Vulnerable, fix available upstream but not yet built"
reason = "An advisory matched and the fixed version exists upstream, awaiting a build"
when = { vulnerability_status = "advisories_matched", remediation_readiness = "awaiting_build" }

# EVERY OTHER VULNERABLE PACKAGE, and this rule is the one the first draft did not
# have. Without it a package with a critical advisory and no remediation verdict --
# because the remediation pass had no fix evidence to read -- fell through all three
# vulnerability rules and matched "behind upstream" at p10. Seeding a demo and
# looking at the screen is what found that; no test would have, because the rule set
# was internally consistent and simply incomplete.
#
# The lesson generalises to any rule set written here: a condition on a SECOND
# domain is a condition on that domain having reached a verdict at all, and every
# domain can be `unknown`. Anything that must never fall through needs a rule
# resting on one domain only.
[[versions."2026.09.4".priority_rules]]
bucket = "p3"
description = "Vulnerable, and no fix is in sight"
reason = "An advisory matched and no fixed version has been established anywhere"
when = { vulnerability_status = "advisories_matched" }

# A forbidden licence is a legal exposure and is actionable now: remove the package
# or record an exception.
[[versions."2026.09.4".priority_rules]]
bucket = "p4"
description = "Licence the policy forbids"
reason = "The licence matched a forbidden rule"
when = { license_outcome = "forbidden" }

# Both conditions matter: an inactive feedstock we are current with is not urgent.
[[versions."2026.09.4".priority_rules]]
bucket = "p5"
description = "Behind upstream, and the feedstock is unmaintained"
reason = "The installed version lags upstream and no recipe activity is recent"
when = { currency_status = "behind", feedstock_presence_status = "present_and_inactive" }

# Behind, and there is no feedstock to update -- somebody has to create a recipe.
[[versions."2026.09.4".priority_rules]]
bucket = "p6"
description = "Behind upstream, with no conda-forge feedstock"
reason = "The installed version lags upstream and no feedstock exists to update"
when = { currency_status = "behind", feedstock_presence_status = "absent" }

# Work, not exposure.
[[versions."2026.09.4".priority_rules]]
bucket = "p7"
description = "Licence needs a human decision"
reason = "The licence matched a restricted rule"
when = { license_outcome = "restricted" }

# Ahead of the inferred case below because a failed build is a fact and a static
# assessment is a guess.
[[versions."2026.09.4".priority_rules]]
bucket = "p8"
description = "Proven not to build on Python 3.14"
reason = "A verification build ran on the assessed series and failed"
when = { python_readiness = "verified_not_ready" }

[[versions."2026.09.4".priority_rules]]
bucket = "p9"
description = "Metadata suggests Python 3.14 will not work"
reason = "Static metadata does not support the assessed series; no build has run"
when = { python_readiness = "inferred_not_ready" }

# Behind upstream with nothing else wrong: the ordinary backlog. NOT a catch-all --
# a package that is current and clean matches no rule and stays unbucketed, which is
# what 2026.09.3's comment means by "nothing reaches p10 by default".
[[versions."2026.09.4".priority_rules]]
bucket = "p10"
description = "Behind upstream"
reason = "The installed version lags the authoritative surface"
when = { currency_status = "behind" }
